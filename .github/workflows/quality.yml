name: Quality

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: modules/web-honeypot/requirements*.txt
      - name: Install checks and web test dependencies
        run: python -m pip install ruff==0.11.13 -r modules/web-honeypot/requirements-dev.txt
      - name: Lint Python
        run: ruff check modules tests
      - name: Check shell syntax
        run: |
          while IFS= read -r -d '' script; do
            if head -n 1 "$script" | grep -q bash; then
              bash -n "$script"
            else
              sh -n "$script"
            fi
          done < <(find scripts modules tests -name '*.sh' -print0)
      - name: Check fixture and public entry contracts
        run: python -m unittest discover -s tests -v
      - name: Check generated dashboard
        working-directory: modules/pipeline
        run: |
          python tools/build_dashboards.py
          git diff --exit-code -- dashboards/honeypot.ndjson
      - name: Run web unit tests
        working-directory: modules/web-honeypot
        run: python -m pytest -q

  containers:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Public entry help without chmod
        run: |
          ./scripts/up.sh --help
          ./scripts/down.sh --help
          ./scripts/preflight.sh --help
      - name: Public entry with Docker (Compose models, failed preflight, second init)
        run: ./tests/check_public_entry_docker.sh --cleanup
      - name: Download DB-IP City Lite for the GeoIP branch
        run: bash modules/pipeline/scripts/download_geoip.sh
      - name: Run Vector tests (no-geo and GeoIP branches)
        run: bash modules/pipeline/tests/run_vector_tests.sh
      - name: Classify sample logs against the versioned baseline
        run: bash modules/pipeline/tests/classify_samples.sh
