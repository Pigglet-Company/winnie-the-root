# =============================================================================
# Módulo C - pipeline (Vector + OpenSearch + OpenSearch Dashboards)
# Requisito previo: scripts/init.sh (crea el volumen externo "honeylogs").
# Modo seguridad:   SECURITY_MODE=dev|prod en .env (ver .env.example)
# Datos sintéticos: docker compose -f compose.yml -f compose.dev.yml up -d
# =============================================================================
name: honeypot-pipeline

x-hardening: &hardening
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL

services:
  # --- Tarea única (root): da permisos al volumen persistente de Vector -------
  pl-perms:
    <<: *hardening
    image: busybox:1.36.1
    container_name: pl-perms
    user: "0:0"
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER]
    command: ["sh", "-c", "mkdir -p /var/lib/vector/dead_letter && chown -R 1000:1000 /var/lib/vector"]
    volumes:
      - vector-data:/var/lib/vector
    network_mode: none
    read_only: true
    restart: "no"
    mem_limit: 32m

  pl-opensearch:
    <<: *hardening
    image: opensearchproject/opensearch:2.17.1
    container_name: pl-opensearch
    env_file:
      - ./env/opensearch.${SECURITY_MODE:-dev}.env
    environment:
      - cluster.name=honeypot-os
      - discovery.type=single-node
      - bootstrap.memory_lock=false
      - OPENSEARCH_JAVA_OPTS=-Xms${OPENSEARCH_HEAP:-1g} -Xmx${OPENSEARCH_HEAP:-1g}
      - OPENSEARCH_INITIAL_ADMIN_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:-}
    ulimits:
      nofile:
        soft: 65536
        hard: 65536
    volumes:
      - os-data:/usr/share/opensearch/data
      - ./opensearch/healthcheck.sh:/healthcheck.sh:ro
    networks: [pl-internal]
    healthcheck:
      test: ["CMD", "sh", "/healthcheck.sh"]
      interval: 15s
      timeout: 10s
      retries: 30
      start_period: 60s
    restart: unless-stopped
    mem_limit: 2g
    cpus: 2

  # --- Tarea única: plantilla de índice, alias y política de retención --------
  pl-setup:
    <<: *hardening
    image: curlimages/curl:8.10.1
    container_name: pl-setup
    entrypoint: ["/bin/sh", "/setup/setup.sh"]
    env_file:
      - ./env/opensearch.${SECURITY_MODE:-dev}.env
    environment:
      - SECURITY_MODE=${SECURITY_MODE:-dev}
      - RETENTION_DAYS=${RETENTION_DAYS:-30}
      - OS_PASS=${OPENSEARCH_ADMIN_PASSWORD:-}
    volumes:
      - ./opensearch:/setup:ro
    networks: [pl-internal]
    depends_on:
      pl-opensearch:
        condition: service_healthy
    read_only: true
    restart: "no"
    mem_limit: 64m

  pl-vector:
    <<: *hardening
    image: timberio/vector:0.43.1-debian
    container_name: pl-vector
    user: "1000:1000"
    entrypoint: ["/bin/sh", "/etc/vector/entrypoint.sh"]
    env_file:
      - ./env/vector.${SECURITY_MODE:-dev}.env
    environment:
      - VECTOR_LOG=info
      - OPENSEARCH_USER=admin
      - OPENSEARCH_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:-}
    volumes:
      - honeylogs:/logs:ro            # logs de los honeypots, SOLO LECTURA
      - ./vector:/etc/vector:ro
      - ./geoip:/geoip:ro
      - vector-data:/var/lib/vector   # checkpoints, buffer en disco y cola de errores
    tmpfs:
      - /tmp:size=16m,mode=1777
    networks: [pl-internal]
    depends_on:
      pl-perms:
        condition: service_completed_successfully
      pl-setup:
        condition: service_completed_successfully
    read_only: true
    restart: unless-stopped
    mem_limit: 512m
    cpus: 1

  pl-dashboards:
    <<: *hardening
    image: opensearchproject/opensearch-dashboards:2.17.1
    container_name: pl-dashboards
    env_file:
      - ./env/dashboards.${SECURITY_MODE:-dev}.env
    environment:
      - OPENSEARCH_PASSWORD=${OPENSEARCH_ADMIN_PASSWORD:-unused}
    ports:
      - "127.0.0.1:5601:5601"         # único puerto publicado del módulo
    networks: [pl-internal, pl-frontend]
    depends_on:
      pl-opensearch:
        condition: service_healthy
    restart: unless-stopped
    mem_limit: 1g
    cpus: 1

networks:
  pl-internal:        # sin salida a Internet: OpenSearch y Vector solo hablan aquí
    internal: true
  pl-frontend:        # solo para publicar Dashboards en 127.0.0.1:5601

volumes:
  honeylogs:
    external: true    # lo crea scripts/init.sh; este módulo lo monta en solo lectura
  vector-data:
  os-data:
