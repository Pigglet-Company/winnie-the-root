  # ===================================================== W03 · REGLA 1.1.0
  # Hecho observado (event_type, service, command, file.*) frente a la
  # interpretación ATT&CK (attack_type/mitre_*), que es anotación de regla
  # versionada (rule.*). Solapamiento: precedencia contextual + rule.matches.
  - name: regla_version_y_ruleset_en_cada_evento
    inputs:
      - insert_at: norm_web
        type: log
        log_fields:
          message: |-
            {"@timestamp":"2026-11-23T11:00:00.000Z","event_id":"22222222-2222-4222-8222-222222222201","honeypot":"web","service":"http","event_type":"request","src_ip":"198.51.100.1","http":{"method":"GET","path":"/","user_agent":"Mozilla/5.0"}}
    outputs:
      - extract_from: classify
        conditions:
          - type: vrl
            source: |
              assert_eq!(.rule.ruleset, "winnie-legacy")
