# =============================================================================
# Tests unitarios de normalización + reglas de clasificación.
#   Ejecutar:  tests/run_vector_tests.sh
# Cada test inyecta una línea nativa en la transformación de normalización y
# comprueba el evento resultante a la salida de "classify" (casos positivos y
# negativos). Para añadir una regla nueva, añade aquí su caso.
# =============================================================================
tests:
  # ------------------------------------------------------------------ COWRIE
  - name: cowrie_connect_es_recon_scan
    inputs:
      - insert_at: norm_cowrie
        type: log
        log_fields:
          message: |-
            {"eventid":"cowrie.session.connect","src_ip":"45.12.34.56","src_port":51234,"dst_ip":"172.30.0.10","dst_port":2222,"session":"a1b2c3d4e5f6","protocol":"ssh","message":"New connection","sensor":"hp-cowrie","timestamp":"2026-11-23T10:15:30.123456Z"}
    outputs:
      - extract_from: classify
        conditions:
          - type: vrl
            source: |
              assert_eq!(.honeypot, "cowrie")
              assert_eq!(.service, "ssh")
              assert_eq!(.event_type, "connection")
              assert_eq!(.src_ip, "45.12.34.56")
              assert_eq!(.src_port, 51234)
              assert_eq!(.dst_port, 2222)
              assert_eq!(.session_id, "a1b2c3d4e5f6")
              assert_eq!(."@timestamp", "2026-11-23T10:15:30.123Z")
              assert_eq!(.attack_type, "recon_scan")
              assert_eq!(.mitre_technique, "T1595")
              assert_eq!(.mitre_tactic, "Reconnaissance")
              assert!(match!(.event_id, r'^[0-9a-f]{8}-[0-9a-f]{4}-4[0-9a-f]{3}-[89ab][0-9a-f]{3}-[0-9a-f]{12}$'))

  - name: cowrie_login_failed_es_brute_force
    inputs:
      - insert_at: norm_cowrie
        type: log
        log_fields:
          message: |-
            {"eventid":"cowrie.login.failed","username":"root","password":"123456","message":"login attempt [root/123456] failed","sensor":"hp-cowrie","timestamp":"2026-11-23T10:15:32.000001Z","src_ip":"45.12.34.56","session":"a1b2c3d4e5f6"}
    outputs:
      - extract_from: classify
        conditions:
          - type: vrl
            source: |
              assert_eq!(.event_type, "auth_attempt")
              assert_eq!(.auth.username, "root")
              assert_eq!(.auth.password, "123456")
              assert_eq!(.auth.success, false)
              assert_eq!(.attack_type, "brute_force")
              assert_eq!(.mitre_technique, "T1110")
              assert_eq!(.mitre_tactic, "Credential Access")

