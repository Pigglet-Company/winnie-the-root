# Módulo B: señuelo web. Requiere haber ejecutado scripts/init.sh (red y volumen externos).
services:
  hp-web:
    build:
      context: .
    image: hp-web:1.0.0
    container_name: hp-web
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    ports:
      - "${HP_BIND_ADDR:-127.0.0.1}:${WEB_HOST_PORT:-8080}:8080"   # 127.0.0.1 por defecto; HP_BIND_ADDR=0.0.0.0 la abre
    user: "10001:10001"
    read_only: true
    cap_drop: [ALL]
    security_opt:
      - no-new-privileges:true
    cpus: 0.50
    mem_limit: 256m
    pids_limit: 128
    tmpfs:
      - /tmp:size=64m,mode=1777,noexec,nosuid,nodev
    volumes:
      - honeylogs-web:/logs/web         # escribe web.jsonl (UID 10001; C lee en RO)
      - hp_web_uploads:/uploads         # volumen AISLADO: solo lo monta este contenedor
    sysctls:
      net.ipv6.conf.all.disable_ipv6: 1
    logging:
      driver: json-file
      options: {max-size: "10m", max-file: "3"}
    networks:
      - honeynet

networks:
  honeynet:
    external: true

volumes:
  honeylogs-web:
    external: true
  hp_web_uploads:
    name: hp-web-uploads
