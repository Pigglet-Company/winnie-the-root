{
  "device.node_id": "srv-prod-01",
  "ip.ignorelist": [],
  "logtype.ignorelist": [],

  "ftp.enabled": true,
  "ftp.port": 2121,
  "ftp.banner": "FTP server ready",

  "mysql.enabled": true,
  "mysql.port": 3306,
  "mysql.banner": "5.7.42-0ubuntu0.18.04.1",

  "redis.enabled": true,
  "redis.port": 6379,

  "git.enabled": false,
  "http.enabled": false,
  "httpproxy.enabled": false,
  "https.enabled": false,
  "mssql.enabled": false,
  "ntp.enabled": false,
  "portscan.enabled": false,
  "rdp.enabled": false,
  "sip.enabled": false,
  "smb.enabled": false,
  "snmp.enabled": false,
  "ssh.enabled": false,
  "tcpbanner.enabled": false,
  "telnet.enabled": false,
  "tftp.enabled": false,
  "vnc.enabled": false,
  "llmnr.enabled": false,
  "docker_registry.enabled": false,

  "logger": {
    "class": "PyLogger",
    "kwargs": {
      "formatters": {
        "plain": {
          "format": "%(message)s"
        }
      },
      "handlers": {
        "console": {
          "class": "logging.StreamHandler",
          "stream": "ext://sys.stdout"
        },
        "file": {
          "class": "logging.handlers.RotatingFileHandler",
          "filename": "/logs/opencanary/opencanary.log",
          "maxBytes": 52428800,
          "backupCount": 5
        }
      }
    }
  }
}
