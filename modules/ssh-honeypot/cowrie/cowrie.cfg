# Solo se sobrescribe lo necesario sobre cowrie.cfg.dist (que ya viene en la imagen).

[honeypot]
# Nombre de host creíble (coherente con motd/hostname/OpenCanary)
hostname = srv-prod-01
# Cierra sesiones inactivas / sin autenticar (evita sesiones colgadas)
interactive_timeout = 180
authentication_timeout = 60
# Graba la sesión (TTY log) en var/lib/cowrie/tty (volumen privado)
ttylog = true
# Límite de descarga por fichero: 10 MiB (solo aplica si el egress lo permite)
download_limit_size = 10485760
# Shell EMULADA: nunca se ejecuta nada del atacante
backend = shell
# Autenticación por lista de userdb.txt
auth_class = UserDB

[shell]
# Huella coherente con Debian 12
kernel_version = 6.1.0-18-amd64
kernel_build_string = #1 SMP PREEMPT_DYNAMIC Debian 6.1.76-1 (2024-02-01)
hardware_platform = x86_64
operating_system = GNU/Linux

[ssh]
enabled = true
version = SSH-2.0-OpenSSH_9.2p1 Debian-2+deb12u3
listen_endpoints = tcp:2222:interface=0.0.0.0
sftp_enabled = true
exec_enabled = true
# direct-tcpip: se registra la petición, pero NO se reenvía tráfico real
forwarding = true
forward_redirect = false
forward_tunnel = false

[telnet]
enabled = true
listen_endpoints = tcp:2223:interface=0.0.0.0

# JSON nativo de Cowrie en el volumen compartido (ruta absoluta).
# cowrie.log (texto) queda en el volumen privado, no se comparte.
[output_jsonlog]
enabled = true
logfile = /logs/cowrie/cowrie.json
epoch_timestamp = false
